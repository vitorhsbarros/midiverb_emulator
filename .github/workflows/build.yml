name: Build

on:
  push:
    branches: [main, master, devel, rc-*]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-macos:
    runs-on: macos-15-intel  # Intel runner: Apple Silicon queue often has no capacity; still builds a universal binary
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cd MidiverbPlugin
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: |
          cd MidiverbPlugin
          cmake --build build --config Release -j$(sysctl -n hw.ncpu)

      - name: Sign (ad-hoc) and package
        run: |
          ART="MidiverbPlugin/build/MidiverbPlugin_artefacts/Release"
          mkdir -p dist
          for b in "$ART"/VST3/*.vst3 "$ART"/AU/*.component "$ART"/Standalone/*.app; do
            codesign --force --deep --sign - "$b"
            lipo -info "$(find "$b/Contents/MacOS" -type f | head -1)"
          done
          ditto -c -k --keepParent "$ART"/VST3/*.vst3 dist/Midiverb-Emulator-macOS.vst3.zip
          ditto -c -k --keepParent "$ART"/AU/*.component dist/Midiverb-Emulator-macOS.component.zip
          ditto -c -k --keepParent "$ART"/Standalone/*.app dist/Midiverb-Emulator-macOS.app.zip

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Midiverb-Emulator-VST3-macOS
          path: dist/Midiverb-Emulator-macOS.vst3.zip

      - name: Upload AU
        uses: actions/upload-artifact@v4
        with:
          name: Midiverb-Emulator-AU-macOS
          path: dist/Midiverb-Emulator-macOS.component.zip

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: Midiverb-Emulator-Standalone-macOS
          path: dist/Midiverb-Emulator-macOS.app.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype6-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libcurl4-openssl-dev

      - name: Configure
        run: |
          cd MidiverbPlugin
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd MidiverbPlugin
          cmake --build build --config Release -j$(nproc)

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Midiverb-Emulator-VST3-Linux
          path: MidiverbPlugin/build/MidiverbPlugin_artefacts/Release/VST3/*.vst3

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cd MidiverbPlugin
          cmake -B build

      - name: Build
        run: |
          cd MidiverbPlugin
          cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Midiverb-Emulator-VST3-Windows
          path: MidiverbPlugin/build/MidiverbPlugin_artefacts/Release/VST3/*.vst3
